name: Publish Postgres MCP to ECR

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/README.md"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: postgres-mcp-image-nonprod
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci --prefix infra
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,amd64
      - uses: docker/setup-buildx-action@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-west-2
          role-to-assume: arn:aws:iam::922751599449:role/postgres-mcp-image-publisher
          allowed-account-ids: "922751599449"
      - uses: pulumi/actions@v7
        with:
          pulumi-version: 3.258.0
      - name: Build and publish image
        env:
          PULUMI_BACKEND_URL: s3://swell-pulumi-state-195969062870?region=us-west-2&awssdk=v2
        run: |
          pulumi login --non-interactive "$PULUMI_BACKEND_URL"
          pulumi -C infra/image up --stack organization/postgres-mcp-image/nonprod \
            --config "postgres-mcp-image:revision=$GITHUB_SHA" --yes --non-interactive
          image_ref=$(pulumi -C infra/image stack output imageRef --stack organization/postgres-mcp-image/nonprod)
          printf 'Published image: `%s`\n' "$image_ref" >> "$GITHUB_STEP_SUMMARY"
