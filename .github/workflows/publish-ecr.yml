name: Publish Postgres MCP to ECR

on:
  workflow_call:

permissions:
  contents: read
  id-token: write

concurrency:
  group: postgres-mcp-image-nonprod
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci --prefix infra
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,amd64
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.9"
      - name: Verify release container through MCP before pushing
        env:
          POSTGRES_MCP_TEST_IMAGE: postgres-mcp:release-smoke
        run: |
          docker buildx build --load --build-arg INSTALL_PRESIDIO=true \
            --build-arg "GIT_REVISION=$GITHUB_SHA" --tag "$POSTGRES_MCP_TEST_IMAGE" .
          uv sync --locked
          uv run pytest tests/integration/test_release_image.py -q
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-west-2
          role-to-assume: arn:aws:iam::922751599449:role/postgres-mcp-image-publisher
          allowed-account-ids: "922751599449"
      - uses: pulumi/actions@v7
        with:
          pulumi-version: 3.258.0
      - name: Publish tested commit
        env:
          PULUMI_BACKEND_URL: s3://swell-pulumi-state-195969062870?region=us-west-2&awssdk=v2
        run: |
          pulumi login --non-interactive "$PULUMI_BACKEND_URL"
          pulumi -C infra/image up --stack organization/postgres-mcp-image/nonprod \
            --config "postgres-mcp-image:revision=$GITHUB_SHA" --yes --non-interactive
          image_ref=$(pulumi -C infra/image stack output imageRef --stack organization/postgres-mcp-image/nonprod)
          printf 'Published image: `%s`\n' "$image_ref" >> "$GITHUB_STEP_SUMMARY"
