name: Postgres MCP CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "**/README.md"

concurrency:
  group: postgres-mcp-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  postgres-mcp-ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start Docker service
        run: sudo service docker start || true

      - name: Verify Docker is running
        run: docker info

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.9"

      - name: Build
        run: uv sync --locked

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Check Pulumi code
        run: |
          npm ci --prefix infra
          npm run check --prefix infra

      - name: Run Lint
        run: |
          uv run ruff format --check .
          uv run ruff check .

      - name: Run Check
        run: uv run pyright

      - name: Run Tests
        run: uv run pytest -v --log-cli-level=INFO

      - uses: docker/setup-buildx-action@v3
      - name: Verify release container through MCP
        env:
          POSTGRES_MCP_TEST_IMAGE: postgres-mcp:release-smoke
        run: |
          docker buildx build --load --build-arg INSTALL_PRESIDIO=true \
            --build-arg "GIT_REVISION=$GITHUB_SHA" --tag "$POSTGRES_MCP_TEST_IMAGE" .
          uv run pytest tests/integration/test_release_image.py -q
